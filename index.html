<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Odin Tic Tac Toe</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Odin Tic Tac Toe</h1>

    <div id="mode-selection-wrapper">
        <p>Player versus:</p>
        <select name="mode-select" id="mode-select">
            <option value="player">Player</option>
            <option value="computer">Computer</option>
        </select>
    </div>
    
    <div id="board">
        <div class="grid-space" data-row="0" data-column="0"></div>
        <div class="grid-space" data-row="0" data-column="1"></div>
        <div class="grid-space" data-row="0" data-column="2"></div>
        <div class="grid-space" data-row="1" data-column="0"></div>
        <div class="grid-space" data-row="1" data-column="1"></div>
        <div class="grid-space" data-row="1" data-column="2"></div>
        <div class="grid-space" data-row="2" data-column="0"></div>
        <div class="grid-space" data-row="2" data-column="1"></div>
        <div class="grid-space" data-row="2" data-column="2"></div>
    </div>

    <button id="reset-button">Reset Game</button>
    

    <dialog id="winner-popup">

    </dialog>
    
    <script src="script.js"></script>
</body>
</html>
